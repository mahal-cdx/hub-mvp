name: ${PROJECT_SLUG:-sales}

services:
  admin:
    image: php:8.3-apache-bookworm
    container_name: ${PROJECT_SLUG:-sales}-admin
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-6021}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_CONTEXT: admin
      APP_NAME: ${APP_NAME:-Sales Foundation} Admin
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales}
      MYSQL_USER: ${MYSQL_USER:-sales_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    volumes:
      - ./apps/admin:/var/www/html
      - ./apps/shared:/var/www/shared:ro
      - ./storage/logs/admin:/var/log/apache2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sales

  users:
    image: php:8.3-apache-bookworm
    container_name: ${PROJECT_SLUG:-sales}-users
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${USERS_PORT:-6022}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_CONTEXT: users
      APP_NAME: ${APP_NAME:-Sales Foundation} Users
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales}
      MYSQL_USER: ${MYSQL_USER:-sales_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    volumes:
      - ./apps/users:/var/www/html
      - ./apps/shared:/var/www/shared:ro
      - ./storage/logs/users:/var/log/apache2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sales

  mysql:
    image: mysql:8.4
    container_name: ${PROJECT_SLUG:-sales}-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales}
      MYSQL_USER: ${MYSQL_USER:-sales_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-6023}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/02-seeds:ro
    networks:
      - sales

  redis:
    image: redis:8-alpine
    container_name: ${PROJECT_SLUG:-sales}-redis
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6024}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change_me}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sales

volumes:
  mysql_data:
    name: ${PROJECT_SLUG:-sales}-mysql-data
  redis_data:
    name: ${PROJECT_SLUG:-sales}-redis-data

networks:
  sales:
    name: ${PROJECT_SLUG:-sales}-network
    driver: bridge
